name: RiskLens CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Linting and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check .

      - name: Run Black Format Check
        run: |
          cd backend
          black --check .

      - name: Run Mypy Type Check
        run: |
          cd backend
          mypy app

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest

  frontend-ci:
    name: Frontend Linting and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Production Compile Check
        run: |
          cd frontend
          npm run build

      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test
